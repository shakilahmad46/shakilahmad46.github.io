<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#e8eefc;
background:radial-gradient(900px 400px at 85% 10%,rgba(56,189,248,.22),transparent 60%),radial-gradient(700px 380px at 40% 120%,rgba(139,92,246,.25),transparent 60%),#0b1220;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,transparent 25%,#000 70%)}
.wrap{position:absolute;left:80px;top:120px;width:1040px;text-align:left}
.tag{font-family:'JetBrains Mono',monospace;font-size:20px;color:#7dd3fc;letter-spacing:.5px}
h1{font-size:64px;font-weight:800;line-height:1.05;margin:14px 0 18px;letter-spacing:-1.5px}
h1 span{background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;color:transparent}
.stack{display:flex;gap:12px;justify-content:flex-start;flex-wrap:wrap}
.chip{border:1px solid rgba(148,163,184,.35);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:600;background:rgba(15,23,42,.6)}
.url{margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#94a3b8}
</style></head><body><div class="grid"></div><div class="wrap">
<div class="tag">// Shakil Ahmad · AI-driven web developer</div>
<h1>Websites and online stores<br>with <span>AI built in</span></h1>
<div class="stack"><div class="chip">Drupal 10/11</div><div class="chip">Next.js</div><div class="chip">Laravel</div><div class="chip">AI integrations</div></div>
<div class="url">shakilahmad46.github.io</div></div></body></html>
